<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11+ English Practice Quest</title>
  <style>
    :root {
      --ink: #17314f;
      --muted: #5b6f86;
      --panel: #ffffff;
      --soft: #f2f7ff;
      --accent: #1f6feb;
      --accent-2: #ffb703;
      --good: #157f3b;
      --bad: #c83232;
      --line: #d8e4f5;
      --shadow: 0 16px 40px rgba(22, 50, 79, 0.14);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(31,111,235,.14), transparent 34rem),
        radial-gradient(circle at 86% 9%, rgba(255,183,3,.20), transparent 28rem),
        linear-gradient(180deg, #f8fbff 0%, #edf6ff 100%);
      min-height: 100vh;
    }

    .app {
      width: min(1160px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    header.hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 24px;
      border-radius: 28px;
      background: rgba(255,255,255,.86);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(216, 228, 245, .9);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3.1rem);
      letter-spacing: -0.04em;
    }

    .mascot {
      width: 110px;
      height: 110px;
      border-radius: 30px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fff2c3, #dbeaff);
      font-size: 3rem;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.72);
    }

    .toolbar {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }

    .pill, select, button, input, textarea {
      font: inherit;
    }

    .pill {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
      box-shadow: 0 6px 18px rgba(22,50,79,.08);
      color: var(--muted);
    }

    select {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 9px 12px;
      color: var(--ink);
      background: #fff;
    }

    .screen { margin-top: 22px; }
    .hidden { display: none !important; }
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(238px, 1fr));
      gap: 16px;
    }

    .topic-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 19px;
      box-shadow: 0 10px 26px rgba(22,50,79,.10);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      min-height: 176px;
      display: grid;
      align-content: space-between;
      gap: 14px;
      text-align: left;
    }

    .topic-card:hover, .topic-card:focus-visible {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: rgba(31,111,235,.45);
      outline: 3px solid rgba(31,111,235,.35);
      outline-offset: 3px;
    }

    .topic-icon {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--soft);
      font-size: 1.55rem;
      margin-bottom: 10px;
    }

    .topic-card h2 {
      margin: 0 0 7px;
      font-size: 1.2rem;
      color: var(--ink);
    }

    .topic-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 1rem;
    }

    .mini-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 1rem;
    }

    .level-dots {
      display: inline-flex;
      gap: 4px;
      vertical-align: middle;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #d3deef;
      display: inline-block;
    }

    .dot.on { background: var(--accent); }

    .quiz-shell { display: grid; gap: 16px; }

    .quiz-top, .question-panel, .feedback-panel, .results-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .quiz-top {
      padding: 17px;
      display: grid;
      gap: 12px;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .quiz-title {
      font-size: 1.22rem;
      font-weight: 800;
    }

    .score-strip {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
    }

    .meter {
      width: 100%;
      height: 14px;
      background: #e7effb;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #d8e4f5;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #7aa7ff);
      transition: width .25s ease;
    }

    .question-panel { padding: clamp(18px, 3vw, 28px); }

    .tag-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tag {
      border-radius: 999px;
      padding: 7px 11px;
      background: var(--soft);
      color: var(--muted);
      font-size: .92rem;
      border: 1px solid var(--line);
    }

    .passage-box, .support-box {
      background: #fbfdff;
      border: 1px solid #dfe9f7;
      border-radius: 18px;
      padding: 16px 18px;
      line-height: 1.6;
      color: #243b55;
      margin: 6px 0 14px;
      max-width: 72ch;
      white-space: pre-line;
    }

    .passage-box:empty, .support-box:empty { display: none; }

    .passage-title {
      font-weight: 900;
      margin-bottom: 6px;
      color: var(--ink);
    }

    .question-text {
      font-size: clamp(1.16rem, 2vw, 1.47rem);
      line-height: 1.55;
      font-weight: 800;
      margin: 0 0 16px;
      max-width: 72ch;
      white-space: pre-line;
      scroll-margin-top: 18px;
    }

    #homeHeading:focus, #resultsHeading:focus, .question-text:focus { outline: none; }

    .choices {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 13px 17px;
      background: var(--accent);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
      box-shadow: 0 9px 18px rgba(31,111,235,.22);
    }

    button:hover:not(:disabled), button:focus-visible:not(:disabled) {
      transform: translateY(-2px);
      outline: 3px solid rgba(31,111,235,.35);
      outline-offset: 3px;
      box-shadow: 0 13px 24px rgba(31,111,235,.26);
    }

    button:disabled { opacity: .55; cursor: not-allowed; }

    .choice-btn {
      background: #fff;
      color: var(--ink);
      text-align: left;
      border: 2px solid var(--line);
      box-shadow: 0 7px 18px rgba(22,50,79,.08);
      min-height: 58px;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .choice-btn.correct { border-color: rgba(21,127,59,.85); background: #edf9f1; }
    .choice-btn.wrong { border-color: rgba(200,50,50,.85); background: #fff0f0; }

    .answer-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
      align-items: center;
    }

    input[type="text"], textarea {
      flex: 1 1 240px;
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      background: #fff;
      min-height: 54px;
      font-size: 1.05rem;
    }

    textarea {
      min-height: 150px;
      line-height: 1.45;
      resize: vertical;
      width: 100%;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
      outline: 3px solid rgba(31,111,235,.24);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(31,111,235,.12);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .secondary {
      background: #eef4ff;
      color: var(--ink);
      box-shadow: none;
      border: 1px solid var(--line);
    }

    .gold {
      background: var(--accent-2);
      color: #412b00;
      box-shadow: 0 9px 18px rgba(255,183,3,.22);
    }

    .feedback-panel {
      padding: 18px 20px;
      line-height: 1.5;
    }

    .feedback-panel.good { border-color: rgba(21,127,59,.55); background: #f2fff5; }
    .feedback-panel.bad { border-color: rgba(200,50,50,.55); background: #fff6f6; }
    .feedback-panel.hint { border-color: rgba(255,183,3,.55); background: #fffaf0; }

    .feedback-panel strong { display: block; margin-bottom: 4px; }

    .results-panel {
      padding: clamp(22px, 4vw, 36px);
      text-align: center;
    }

    .big-score {
      font-size: clamp(2.2rem, 6vw, 4.3rem);
      font-weight: 900;
      letter-spacing: -.05em;
      margin: 10px 0;
    }

    .table-card {
      overflow-x: auto;
      margin: 14px 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
    }

    .word-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    .word-card {
      flex: 1 1 120px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      text-align: center;
      font-weight: 900;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 360px;
      background: white;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th { background: var(--soft); }

    .checklist {
      display: grid;
      gap: 8px;
      margin: 10px 0 0;
      padding-left: 0;
      list-style: none;
    }

    .checklist li {
      background: rgba(255,255,255,.7);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 11px;
    }

    .checklist .yes { color: var(--good); font-weight: 900; }
    .checklist .no { color: var(--bad); font-weight: 900; }

    .review-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 18px;
      text-align: left;
    }

    .review-card {
      border: 1px solid var(--line);
      background: #fbfdff;
      border-radius: 16px;
      padding: 14px;
    }

    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #eef4ff;
      border: 1px solid var(--line);
      padding: 2px 6px;
      border-radius: 7px;
    }



    .interaction-wrap {
      display: block;
      background: #fbfdff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      margin-top: 12px;
    }

    .drag-instructions {
      color: var(--muted);
      font-weight: 800;
      margin: 0 0 10px;
    }

    .drag-bank, .drop-zone, .match-grid, .click-option-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: stretch;
    }

    .drag-bank {
      padding: 12px;
      border: 1px dashed #aec3e4;
      border-radius: 16px;
      background: #f3f8ff;
      min-height: 62px;
      margin-bottom: 12px;
    }

    .drop-zone {
      min-height: 76px;
      padding: 12px;
      border: 2px dashed #5579ad;
      border-radius: 16px;
      background: #ffffff;
      align-content: flex-start;
      position: relative;
    }

    .drop-zone::before {
      content: attr(data-placeholder);
      color: #4f6884;
      font-weight: 800;
      position: absolute;
      left: 14px;
      top: 14px;
      pointer-events: none;
    }

    .drop-zone:not(:empty)::before { display: none; }

    .drag-token {
      user-select: none;
      touch-action: manipulation;
      background: #ffffff;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 11px 13px;
      color: var(--ink);
      font-weight: 900;
      box-shadow: 0 6px 14px rgba(22,50,79,.08);
      cursor: grab;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .drag-token:active { cursor: grabbing; }
    .drag-token.selected {
      border-color: var(--accent);
      background: #eaf2ff;
      outline: 3px solid rgba(31,111,235,.22);
    }

    .match-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
      margin: 10px 0 12px;
    }

    .match-row {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) minmax(120px, 1.25fr);
      gap: 9px;
      align-items: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px;
    }

    .match-term { font-weight: 900; }

    .match-slot {
      min-height: 52px;
      border: 2px dashed #5579ad;
      border-radius: 14px;
      background: #fbfdff;
      padding: 7px;
    }

    .match-slot:focus-visible {
      outline: 3px solid rgba(31,111,235,.35);
      outline-offset: 2px;
    }

    .match-slot .drag-token { width: 100%; justify-content: center; }

    .interaction-actions { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }

    .disabled-interaction { opacity: .72; pointer-events: none; }

    @media (max-width: 680px) {
      header.hero { grid-template-columns: 1fr; }
      .mascot { width: 82px; height: 82px; font-size: 2.4rem; }
      .app { width: min(100% - 18px, 1160px); padding-top: 12px; }
      .choices { grid-template-columns: 1fr; }
      .toolbar { justify-content: stretch; }
      .toolbar .pill, .toolbar button { flex: 1 1 100%; }
      .match-grid { grid-template-columns: minmax(0, 1fr); }
      .match-row { grid-template-columns: minmax(0, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1 id="homeHeading" tabindex="-1">11+ English Practice Quest</h1>
      </div>
      <div class="mascot" aria-hidden="true">📚</div>
    </header>

    <section class="toolbar" id="homeToolbar">
      <label class="pill">Questions per round
        <select id="sessionLength" aria-label="Questions per round">
          <option value="10">10</option>
          <option value="15" selected>15</option>
          <option value="20">20</option>
          <option value="30">30</option>
        </select>
      </label>
      <button class="secondary" id="resetProgressBtn" type="button">Reset progress</button>
    </section>

    <section class="screen" id="homeScreen">
      <div class="topic-grid" id="topicGrid"></div>
    </section>

    <section class="screen hidden" id="quizScreen">
      <div class="quiz-shell">
        <div class="quiz-top">
          <div class="top-row">
            <div class="quiz-title" id="quizTitle">Topic</div>
            <div class="score-strip">
              <span id="scoreText">Score 0</span>
              <span id="questionCountText">Question 1</span>
              <span id="levelText">Level 2</span>
            </div>
          </div>
          <div class="meter" id="progressMeter" role="progressbar" aria-label="Questions completed" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0"><div class="meter-fill" id="progressFill"></div></div>
        </div>

        <article class="question-panel" id="questionPanel">
          <div class="tag-row" id="tagRow"></div>
          <div class="passage-box hidden" id="passageBox"></div>
          <div class="support-box hidden" id="supportBox"></div>
          <h2 class="question-text" id="questionText" tabindex="-1"></h2>
          <div class="choices" id="choicesWrap"></div>
          <form class="answer-row hidden" id="answerForm">
            <input id="answerInput" type="text" autocomplete="off" aria-label="Your answer" />
            <textarea id="answerTextArea" class="hidden" autocomplete="off" aria-label="Your written answer"></textarea>
            <button type="submit" id="submitBtn">Check answer</button>
          </form>
          <div class="actions">
            <button class="gold" id="hintBtn" type="button">Show hint</button>
            <button class="secondary hidden" id="nextBtn" type="button">Next question</button>
            <button class="secondary" id="backBtn" type="button">Choose topic</button>
          </div>
        </article>

        <div class="feedback-panel hidden" id="feedbackPanel" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section class="screen hidden" id="resultsScreen">
      <div class="results-panel">
        <h2 id="resultsHeading" tabindex="-1">Round complete!</h2>
        <div class="big-score" id="finalScore">0/0</div>
        <p id="finalMessage"></p>
        <div class="review-grid" id="topicReview"></div>
        <div class="actions" style="justify-content:center">
          <button id="playAgainBtn" type="button">Play this topic again</button>
          <button class="secondary" id="homeBtn" type="button">Choose another topic</button>
        </div>
        <div class="table-card" id="reviewWrap"></div>
      </div>
    </section>
  </main>

  <script>
    const TOPICS = {
      reading: {
        name: "Reading Comprehension",
        icon: "📖",
        blurb: "Inference, retrieval, main ideas, tone, purpose and evidence from short original passages."
      },
      vocab: {
        name: "Vocabulary",
        icon: "🧩",
        blurb: "Synonyms, antonyms, word meanings, prefixes, suffixes, compound words and context clues."
      },
      grammar: {
        name: "Grammar & Punctuation",
        icon: "✍️",
        blurb: "Parts of speech, tenses, agreement, pronouns, apostrophes, commas and direct speech."
      },
      spelling: {
        name: "Spelling & Word Choice",
        icon: "🔤",
        blurb: "Common 11+ spellings, homophones, plurals, endings, precise vocabulary and dictionary order."
      },
      sentence: {
        name: "Sentence Skills",
        icon: "📝",
        blurb: "Cloze, connectives, sentence combining, paragraph order, formal tone and clear expression."
      },
      verbal: {
        name: "Verbal Reasoning",
        icon: "🔎",
        blurb: "Word analogies, hidden words, letter codes, classifications, compounds and language logic."
      },
      writing: {
        name: "Writing Skills",
        icon: "🌟",
        blurb: "Writing skills through selectable responses: planning, editing, best openings, summaries, dialogue and sentence improvement."
      },
      mixed: {
        name: "Mixed Practice",
        icon: "⭐",
        blurb: "A balanced round across all seven English skill areas."
      }
    };

    const ACTIVE_TOPICS = Object.keys(TOPICS).filter(t => t !== "mixed");
    const BANK = [];
    let familyCounter = 0;

    const els = {
      homeHeading: document.getElementById("homeHeading"),
      topicGrid: document.getElementById("topicGrid"),
      homeScreen: document.getElementById("homeScreen"),
      quizScreen: document.getElementById("quizScreen"),
      resultsScreen: document.getElementById("resultsScreen"),
      homeToolbar: document.getElementById("homeToolbar"),
      sessionLength: document.getElementById("sessionLength"),
      resetProgressBtn: document.getElementById("resetProgressBtn"),
      quizTitle: document.getElementById("quizTitle"),
      scoreText: document.getElementById("scoreText"),
      questionCountText: document.getElementById("questionCountText"),
      levelText: document.getElementById("levelText"),
      progressMeter: document.getElementById("progressMeter"),
      progressFill: document.getElementById("progressFill"),
      tagRow: document.getElementById("tagRow"),
      passageBox: document.getElementById("passageBox"),
      supportBox: document.getElementById("supportBox"),
      questionText: document.getElementById("questionText"),
      choicesWrap: document.getElementById("choicesWrap"),
      answerForm: document.getElementById("answerForm"),
      answerInput: document.getElementById("answerInput"),
      answerTextArea: document.getElementById("answerTextArea"),
      submitBtn: document.getElementById("submitBtn"),
      hintBtn: document.getElementById("hintBtn"),
      nextBtn: document.getElementById("nextBtn"),
      backBtn: document.getElementById("backBtn"),
      feedbackPanel: document.getElementById("feedbackPanel"),
      finalScore: document.getElementById("finalScore"),
      resultsHeading: document.getElementById("resultsHeading"),
      finalMessage: document.getElementById("finalMessage"),
      topicReview: document.getElementById("topicReview"),
      playAgainBtn: document.getElementById("playAgainBtn"),
      homeBtn: document.getElementById("homeBtn"),
      reviewWrap: document.getElementById("reviewWrap")
    };

    const defaultProgress = () => {
      const topics = {};
      ACTIVE_TOPICS.forEach(id => topics[id] = { level: 2, total: 0, correct: 0, streak: 0, misses: 0, bestStreak: 0 });
      return { topics, lifetime: { total: 0, correct: 0 } };
    };

    let progress = loadProgress();
    let state = {
      topic: null,
      currentQuestion: null,
      currentEntry: null,
      used: new Set(),
      index: 0,
      length: 15,
      score: 0,
      answered: false,
      history: [],
      questionKeys: new Set(),
      previousQuestionKeys: new Set(),
      roundSeed: 1
    };

    function loadProgress() {
      try {
        const raw = localStorage.getItem("elevenPlusEnglishProgressV2");
        const parsed = raw ? JSON.parse(raw) : {};
        const base = defaultProgress();
        const storedTopics = parsed && typeof parsed.topics === "object" ? parsed.topics : {};
        ACTIVE_TOPICS.forEach(id => {
          const stored = storedTopics[id] && typeof storedTopics[id] === "object" ? storedTopics[id] : {};
          const total = Math.max(0, Math.floor(Number(stored.total) || 0));
          base.topics[id] = {
            level: clamp(Math.round(Number(stored.level) || 2), 1, 5),
            total,
            correct: clamp(Math.floor(Number(stored.correct) || 0), 0, total),
            streak: clamp(Math.floor(Number(stored.streak) || 0), 0, 2),
            misses: clamp(Math.floor(Number(stored.misses) || 0), 0, 1),
            bestStreak: Math.max(0, Math.floor(Number(stored.bestStreak) || 0))
          };
        });
        const lifetime = parsed && typeof parsed.lifetime === "object" ? parsed.lifetime : {};
        const lifetimeTotal = Math.max(0, Math.floor(Number(lifetime.total) || 0));
        base.lifetime = {
          total: lifetimeTotal,
          correct: clamp(Math.floor(Number(lifetime.correct) || 0), 0, lifetimeTotal)
        };
        return base;
      } catch (e) {
        return defaultProgress();
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem("elevenPlusEnglishProgressV2", JSON.stringify(progress));
      } catch (e) {
        // Practice continues even when storage is unavailable.
      }
    }

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
    let randomSource = Math.random;
    function randomUnit() { return randomSource(); }
    function rint(min, max) { return Math.floor(randomUnit() * (max - min + 1)) + min; }
    function pick(arr) { return arr[rint(0, arr.length - 1)]; }
    function shuffle(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = rint(0, i);
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
    function hashString(value) {
      let hash = 2166136261;
      const text = String(value);
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }
    function seededRandom(seed) {
      let value = seed >>> 0;
      return function() {
        value += 0x6D2B79F5;
        let t = value;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function withSeed(seed, callback) {
      const previous = randomSource;
      randomSource = seededRandom(seed);
      try { return callback(); }
      finally { randomSource = previous; }
    }
    function freshSeed() {
      try {
        const value = new Uint32Array(1);
        crypto.getRandomValues(value);
        return value[0] || 1;
      } catch (e) {
        return (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0 || 1;
      }
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    }
    function fmt(n) {
      if (typeof n !== "number") return String(n);
      if (Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n));
      return String(Math.round(n * 1000) / 1000).replace(/\.0+$/, "");
    }
    function money(n) { return "£" + Number(n).toFixed(2); }
    function normalise(s) {
      return String(s)
        .toLowerCase()
        .replace(/[“”]/g, '"')
        .replace(/[‘’]/g, "'")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/^[\s\"'.,;:!?()]+|[\s\"'.,;:!?()]+$/g, "");
    }
    function comparisonKey(value) {
      const raw = String(value).trim();
      return /[A-Za-z0-9]/.test(raw) ? normalise(raw) : raw;
    }
    function formatSentences(value) {
      return String(value).replace(/([.!?][”\"']?)\s+(?=[A-Z“\"'])/g, "$1\n\n");
    }
    function formatTextHtml(value) {
      return escapeHtml(formatSentences(value)).replace(/\n/g, "<br>");
    }
    function wordCount(text) {
      const m = String(text).trim().match(/[A-Za-z]+(?:'[A-Za-z]+)?/g);
      return m ? m.length : 0;
    }
    function cleanNumber(raw) {
      const text = String(raw).replace(/[£,$]/g, "").trim();
      const match = text.match(/-?\d+(?:\.\d+)?/);
      return match ? Number(match[0]) : NaN;
    }
    function plural(n, singular, pluralWord) { return n === 1 ? singular : (pluralWord || singular + "s"); }

    function answerLabel(q) {
      if (q.kind === "order" && Array.isArray(q.answer)) return q.answer.join(" → ");
      if (q.kind === "match" && q.answer && typeof q.answer === "object") return Object.keys(q.answer).map(k => `${k}: ${q.answer[k]}`).join("; ");
      if (Array.isArray(q.answer)) return q.answer.join(", ");
      if (q.answerType === "money") return money(Number(q.answer));
      return String(q.answer);
    }

    function makeChoices(answer, distractors, labelFn) {
      const seen = new Set();
      const items = [];
      [answer].concat(distractors || []).forEach(v => {
        const key = comparisonKey(v);
        if (!seen.has(key)) {
          seen.add(key);
          items.push({ value: v, label: labelFn ? labelFn(v) : String(v) });
        }
      });
      return shuffle(items.slice(0, 4));
    }

    function qBase(topic, title, diff, kind, prompt, answer, opts = {}) {
      return Object.assign({
        topic,
        title,
        difficulty: diff,
        kind,
        prompt,
        answer,
        answerType: "text",
        hint: "Read the question carefully, then eliminate answers that do not fit.",
        explanation: "Check the clue in the wording and compare it with the answer."
      }, opts);
    }

    function htmlTable(headers, rows) {
      return `<div class="table-card"><table><thead><tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${escapeHtml(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }

    function wordCards(items) {
      return `<div class="word-cards" aria-label="Words to compare">${items.map(i => `<span class="word-card">${escapeHtml(i)}</span>`).join("")}</div>`;
    }

    function addFamily(topic, title, gen, count = 8) {
      familyCounter += 1;
      for (let seed = 1; seed <= count; seed++) {
        BANK.push({
          id: `${topic}-${familyCounter}-${seed}`,
          topic,

          seed,
          gen
        });

    }

    function topicLevel(topic) { return progress.topics[topic]?.level || 2; }
    function dotLevel(level) {
      return `<span class="level-dots" aria-label="Level ${level} out of 5">${[1,2,3,4,5].map(n => `<span class="dot ${n <= level ? "on" : ""}"></span>`).join("")}</span>`;
    }

    function isCorrect(value, q) {
      if (q.kind === "order") {
        return Array.isArray(value) && Array.isArray(q.answer) && value.length === q.answer.length && value.every((v, i) => normalise(v) === normalise(q.answer[i]));
      }
      if (q.kind === "match") {
        return value && q.answer && Object.keys(q.answer).every(k => normalise(value[k]) === normalise(q.answer[k]));
      }
      if (q.answerType === "number") {
        const input = cleanNumber(value);
        return Number.isFinite(input) && Math.abs(input - Number(q.answer)) <= (q.tolerance ?? 0.001);
      }
      if (q.answerType === "money") {
        const input = cleanNumber(value);
        return Number.isFinite(input) && Math.abs(input - Number(q.answer)) <= 0.005;
      }
      if (q.answerType === "list") {
        const inputItems = String(value).toLowerCase().replace(/\band\b/g, ",").split(/[ ,;]+/).map(x => x.trim()).filter(Boolean).sort();
        const targetItems = q.answer.map(x => String(x).toLowerCase()).sort();
        return inputItems.length === targetItems.length && inputItems.every((x, i) => x === targetItems[i]);
      }
      const clean = comparisonKey(value);
      if (Array.isArray(q.accept)) return q.accept.map(comparisonKey).includes(clean);
      return clean === comparisonKey(q.answer);
    }

    function gradeWriting(text, q) {
      const wc = wordCount(text);
      const lower = normalise(text);
      const sentences = String(text).split(/[.!?]+/).map(s => s.trim()).filter(Boolean);
      const checks = [];
      function add(label, pass) { checks.push({ label, pass: Boolean(pass) }); }
      add(`At least ${q.minWords || 35} words`, wc >= (q.minWords || 35));
      add("Clear sentence punctuation", /[.!?]/.test(text) && sentences.length >= (q.minSentences || 2));
      add("Capital letters used at sentence starts or for names", /(^|[.!?]\s+)[A-Z]/.test(String(text).trim()));
      if (q.focus === "description") {
        add("Sensory or descriptive vocabulary", /\b(glowed|whispered|gloomy|bright|icy|warm|rough|smooth|silent|echoed|fragrant|sour|golden|shadow|sparkling|trembling|crisp|misty|velvet|thunder|murmur)\b/i.test(text));
        add("A simile or comparison", /\blike\b|\bas .* as\b/i.test(text));
      } else if (q.focus === "persuasion") {
        add("A clear opinion", /\b(i believe|we should|must|need to|in my opinion|surely)\b/i.test(text));
        add("A persuasive technique", /\?|\btherefore\b|\bhowever\b|\bbecause\b|\bmust\b|\bshould\b/i.test(text));
      } else if (q.focus === "dialogue") {
        add("Speech marks or dialogue punctuation", /["“”']/.test(text));
        add("A speech verb", /\b(said|asked|whispered|replied|muttered|called|shouted)\b/i.test(text));
      } else if (q.focus === "summary") {
        add("Concise enough for a summary", wc <= (q.maxWords || 45));
        add("Includes key information", q.keywords ? q.keywords.some(k => lower.includes(normalise(k))) : wc > 10);
      } else {
        add("Relevant detail included", wc >= 20);
        add("Varied vocabulary", new Set(String(text).toLowerCase().match(/[a-z]+/g) || []).size >= Math.min(20, wc - 2));
      }
      const passCount = checks.filter(c => c.pass).length;
      const correct = passCount >= Math.ceil(checks.length * .7);
      const list = `<ul class="checklist">${checks.map(c => `<li><span class="${c.pass ? "yes" : "no"}">${c.pass ? "✓" : "✗"}</span> ${escapeHtml(c.label)}</li>`).join("")}</ul>`;
      const model = q.model ? `<p><strong>Model idea:</strong> ${escapeHtml(q.model)}</p>` : "";
      return {
        correct,
        score: passCount,
        total: checks.length,
        html: `${model}<p>You met ${passCount} out of ${checks.length} writing checks. This is a guided check, so read your work again and improve one target before moving on.</p>${list}`
      };
    }

    function renderHome() {
      els.topicGrid.innerHTML = Object.keys(TOPICS).map(id => {
        const t = TOPICS[id];
        const level = id === "mixed" ? Math.round(ACTIVE_TOPICS.reduce((a, k) => a + topicLevel(k), 0) / ACTIVE_TOPICS.length) : topicLevel(id);
        const total = id === "mixed" ? progress.lifetime.total : progress.topics[id].total;
        const correct = id === "mixed" ? progress.lifetime.correct : progress.topics[id].correct;
        const pct = total ? Math.round(correct / total * 100) : 0;
        return `<button class="topic-card" type="button" data-topic="${id}">
          <div>
            <div class="topic-icon" aria-hidden="true">${t.icon}</div>
            <h2>${escapeHtml(t.name)}</h2>
            <p>${escapeHtml(t.blurb)}</p>
          </div>
          <div class="mini-stats"><span>${dotLevel(level)}</span><span>${total ? pct + "% correct so far" : "Ready to start"}</span></div>
        </button>`;
      }).join("");
      document.querySelectorAll(".topic-card").forEach(card => {
        card.addEventListener("click", () => startRound(card.dataset.topic));
      });
    }

    function startRound(topic) {
      const previousQuestionKeys = state.topic === topic && state.questionKeys ? new Set(state.questionKeys) : new Set();
      state = {
        topic,
        currentQuestion: null,
        currentEntry: null,
        used: new Set(),
        index: 0,
        length: Number(els.sessionLength.value),
        score: 0,
        answered: false,
        history: [],
        questionKeys: new Set(),
        previousQuestionKeys,
        topicCounts: {},
        roundSeed: freshSeed()
      };
      els.homeScreen.classList.add("hidden");
      els.resultsScreen.classList.add("hidden");
      els.homeToolbar.classList.add("hidden");
      els.quizScreen.classList.remove("hidden");
      els.quizTitle.textContent = TOPICS[topic].name;
      loadQuestion();
    }

    function pickEntry() {
      const topicIds = state.topic === "mixed" ? ACTIVE_TOPICS : [state.topic];
      const availableTopics = topicIds.filter(topic => BANK.some(entry => entry.topic === topic && !state.used.has(entry.id)));
      if (!availableTopics.length) return null;
      let chosenTopic = availableTopics[0];
      if (state.topic === "mixed") {
        const fewest = Math.min(...availableTopics.map(topic => state.topicCounts[topic] || 0));
        chosenTopic = pick(availableTopics.filter(topic => (state.topicCounts[topic] || 0) === fewest));
      }
      const target = topicLevel(chosenTopic);
      const available = BANK.filter(entry => entry.topic === chosenTopic && !state.used.has(entry.id));
      const exact = available.filter(entry => entry.difficulty === target);
      const adjacent = available.filter(entry => Math.abs(entry.difficulty - target) === 1);
      let candidates;
      if (exact.length && (!adjacent.length || randomUnit() < 0.8)) candidates = exact;
      else if (adjacent.length) candidates = adjacent;
      else if (exact.length) candidates = exact;
      else {
        const nearestDistance = Math.min(...available.map(entry => Math.abs(entry.difficulty - target)));
        candidates = available.filter(entry => Math.abs(entry.difficulty - target) === nearestDistance);
      }
      return pick(candidates);
    }

    function stableAnswerValue(answer) {
      if (Array.isArray(answer)) return answer.map(stableAnswerValue).join("→");
      if (answer && typeof answer === "object") return Object.keys(answer).sort().map(key => `${normalise(key)}:${stableAnswerValue(answer[key])}`).join("|");
      return comparisonKey(answer);
    }

    function supportFingerprint(support) {
      return String(support || "")
        .replace(/<[^>]*>/g, " ")
        .replace(/&[a-z]+;/gi, " ")
        .toLowerCase()
        .split(/\s+/)
        .filter(Boolean)
        .sort()
        .join(" ");
    }

    function questionFingerprint(q) {
      return [
        q.topic,
        normalise(q.prompt),
        normalise(q.passage || ""),
        supportFingerprint(q.support),
        stableAnswerValue(q.answer)
      ].join("¦");
    }

    function generateQuestion(entry, variantAttempt) {
      const seed = hashString(`${state.roundSeed}|${entry.id}|${variantAttempt}`);
      let q = withSeed(seed, () => entry.gen(entry.difficulty, entry.seed));
      q.difficulty = entry.difficulty;
      return makeNonTypedQuestion(q);
    }

    function displayValue(value) {
      if (Array.isArray(value)) return value.join(" → ");
      if (value && typeof value === "object") return Object.keys(value).map(k => `${k}: ${value[k]}`).join("; ");
      return String(value);
    }

    function smartDistractors(q) {
      if (Array.isArray(q.distractors)) return q.distractors;
      if (q.answerType === "number") {
        const a = Number(q.answer);
        return [a + 1, a - 1, a + 2, Math.max(0, a - 2), a + 5].filter(v => Number.isFinite(v) && v !== a);
      }
      if (q.answerType === "money") {
        const a = Number(q.answer);
        return [a + 1, Math.max(0, a - 1), a + .5, Math.max(0, a - .5)].map(v => Math.round(v * 100) / 100).filter(v => v !== a);
      }
      if (q.answerType === "list") {
        const shown = Array.isArray(q.answer) ? q.answer.join(", ") : String(q.answer);
        return [shown.split(",").reverse().join(","), "none", "all of them", "cannot tell"];
      }
      const title = String(q.title || "").toLowerCase();
      if (title.includes("contraction")) return ["dont", "cant", "wont", "theyre", "weve", "Id", "do'nt", "ca'nt"].filter(x => normalise(x) !== normalise(q.answer));
      if (title.includes("spelling") || title.includes("misspelling")) {
        const a = String(q.answer);
        return [a.replace(/e/g, "a"), a.replace(/a/g, "e"), a.slice(0, -1), a + a.slice(-1), a.replace(/([a-z])([a-z])/i, "$2$1")].filter(x => x && normalise(x) !== normalise(a));
      }
      if (title.includes("punctuation")) return [".", ",", "?", "!", "'", ";"].filter(x => comparisonKey(x) !== comparisonKey(q.answer));
      if (title.includes("synonym")) return ["opposite", "similar", "different", "rare", "ordinary", "clear"].filter(x => normalise(x) !== normalise(q.answer));
      if (title.includes("hidden")) return ["seal", "newt", "dean", "tin", "ant", "ear", "rat"].filter(x => normalise(x) !== normalise(q.answer));
      return ["Cannot tell", "None of these", "All of these", "Another answer"];

    function makeNonTypedQuestion(q) {
      if (q.kind === "writing") {
        const model = q.model && !/checklist/i.test(q.model) ? q.model : "A clear answer should be concise, accurate and focused on the main point.";
        let newPrompt = "Which response best fulfils this writing task?";
        if (q.focus === "summary") newPrompt = "Which sentence is the best concise summary of the text?";
        else if (q.focus === "description") newPrompt = q.prompt.replace(/^Write a short description of/i, "Which response gives the strongest short description of").replace(/\. Aim.*$/i, "?");
        else if (q.focus === "persuasion") newPrompt = q.prompt.replace(/^Write a short persuasive paragraph arguing that/i, "Which response gives the strongest persuasive paragraph arguing that").replace(/\.$/, "?");
        else if (q.focus === "dialogue") newPrompt = q.prompt.replace(/^Write a short piece of dialogue for this situation:/i, "Which response gives the strongest dialogue for this situation:").replace(/\.$/, "?");
        return Object.assign({}, q, {
          kind: "mc",
          prompt: newPrompt,
          answer: model,
          answerType: "text",
          choices: makeChoices(model, writingDistractors(q, model)),
          hint: q.hint || "Choose the response that is clear, relevant and controlled.",
          explanation: `${q.explanation || "A strong answer fits the purpose and uses controlled language."} The best response is clear, relevant and carefully expressed.`
        });
      }
      if (q.kind === "short") {
        const next = Object.assign({}, q, { kind: "mc" });
        if (!next.choices) next.choices = makeChoices(next.answer, smartDistractors(next), v => next.answerType === "money" ? money(Number(v)) : Array.isArray(v) ? v.join(", ") : String(v));
        if (/^write/i.test(next.prompt)) next.prompt = next.prompt.replace(/^Write/i, "Choose");
        if (/^type/i.test(next.prompt)) next.prompt = next.prompt.replace(/^Type/i, "Choose");
        if (/^correct this spelling/i.test(next.prompt)) next.prompt = next.prompt.replace(/^Choose the correct spelling for/i, "Choose the correct spelling for");
        return next;
      }
      return q;

    function selectMatchToken(token) {
      if (selectedDragToken === token) {
        clearDragSelection();
        announceInteraction(`${token.dataset.value} deselected.`);
        return;
      }
      clearDragSelection();
      selectedDragToken = token;
      token.classList.add("selected");
      token.setAttribute("aria-pressed", "true");
      announceInteraction(`${token.dataset.value} selected. Now choose a matching box.`);
    }

    function placeSelectedToken(slot) {
      if (!selectedDragToken) {
        announceInteraction("Choose an answer card first.");
        return;
      }
      const bank = document.getElementById("dragBank");
      if (slot.firstElementChild && bank) bank.appendChild(slot.firstElementChild);
      const token = selectedDragToken;
      slot.appendChild(token);
      clearDragSelection();
      announceInteraction(`${token.dataset.value} placed with ${slot.dataset.key}.`);
    }

    function makeDragToken(text) {
      const token = document.createElement("button");
      token.type = "button";
      token.className = "drag-token";
      token.draggable = true;
      token.textContent = text;
      token.dataset.value = text;
      token.setAttribute("aria-pressed", "false");
      token.addEventListener("dragstart", e => {
        window.__dragToken = token;
        e.dataTransfer.setData("text/plain", text);
      });
      token.addEventListener("keydown", event => {
        if (["Enter", " ", "Space", "Spacebar"].includes(event.key)) {
          event.preventDefault();
          token.click();
        }
      });
      token.addEventListener("click", event => {
        event.stopPropagation();
        const bank = document.getElementById("dragBank");
        const order = document.getElementById("orderZone");
        if (order) {
          if (token.parentElement === bank) {
            order.appendChild(token);
            announceInteraction(`${text} added to the answer order.`);
          } else {
            bank.appendChild(token);
            announceInteraction(`${text} returned to the card bank.`);
          }
        } else if (bank && token.parentElement?.classList.contains("match-slot")) {
          bank.appendChild(token);
          clearDragSelection();
          announceInteraction(`${text} returned to the card bank.`);
        } else if (bank && token.parentElement === bank) {
          selectMatchToken(token);
        }
      });
      return token;
    }

          if (bank) bank.appendChild(zone.firstElementChild);

        if (zone.id === "orderZone") {
          const siblings = [...zone.querySelectorAll(".drag-token")].filter(item => item !== token);
          const next = siblings.find(item => {
            const rect = item.getBoundingClientRect();
            return e.clientY < rect.top + rect.height / 2 || (e.clientY <= rect.bottom && e.clientX < rect.left + rect.width / 2);
          });
          if (next) zone.insertBefore(token, next);
          else zone.appendChild(token);
        } else {
          zone.appendChild(token);
        }
        clearDragSelection();
        announceInteraction(`${token.dataset.value} moved.`);
      });
    }

    function renderOrderQuestion(q) {
      els.answerForm.classList.add("hidden");
      els.choicesWrap.className = "choices interaction-wrap";
      els.choicesWrap.innerHTML = `<p class="drag-instructions">Put every card into the answer box in the correct order. Drag a card, or select it to add it. Select it again to return it.</p><div class="drag-bank" id="dragBank" aria-label="Cards available to order"></div><div class="drop-zone" id="orderZone" aria-label="Your answer order" data-placeholder="Place the cards here in order"></div><div class="interaction-actions"><button type="button" id="checkInteractiveBtn">Check answer</button><button type="button" class="secondary" id="clearInteractiveBtn">Clear</button></div><p id="interactionStatus" class="sr-only" aria-live="polite"></p>`;
      const bank = document.getElementById("dragBank");
      const orderZone = document.getElementById("orderZone");
      allowDrop(bank);
      allowDrop(orderZone);
      shuffle(q.items || q.answer).forEach(item => bank.appendChild(makeDragToken(item)));
      document.getElementById("clearInteractiveBtn").addEventListener("click", () => {
        [...orderZone.children].forEach(t => bank.appendChild(t));
        clearDragSelection();
        announceInteraction("The answer order has been cleared.");
      });
      document.getElementById("checkInteractiveBtn").addEventListener("click", () => {
        const answer = [...orderZone.children].map(t => t.dataset.value);
        if (answer.length !== q.answer.length) {
          els.feedbackPanel.className = "feedback-panel hint";
          els.feedbackPanel.innerHTML = `<strong>Nearly there</strong><p>Move all ${q.answer.length} cards into the answer box before checking.</p>`;
          els.feedbackPanel.classList.remove("hidden");
          return;
        }
        submitAnswer(answer);
      });
    }

    function renderMatchQuestion(q) {
      els.answerForm.classList.add("hidden");
      const keys = Object.keys(q.answer);
      const values = shuffle(Object.values(q.answer));
      els.choicesWrap.className = "choices interaction-wrap";
      els.choicesWrap.innerHTML = `<p class="drag-instructions">Match every card to the correct box. Drag a card, or select a card and then select its matching box.</p><div class="drag-bank" id="dragBank" aria-label="Answer cards to match"></div><div class="match-grid" id="matchGrid"></div><div class="interaction-actions"><button type="button" id="checkInteractiveBtn">Check answer</button><button type="button" class="secondary" id="clearInteractiveBtn">Clear</button></div><p id="interactionStatus" class="sr-only" aria-live="polite"></p>`;
      const bank = document.getElementById("dragBank");
      const grid = document.getElementById("matchGrid");
      allowDrop(bank);
      values.forEach(v => bank.appendChild(makeDragToken(v)));
      keys.forEach(k => {
        const row = document.createElement("div");
        row.className = "match-row";
        row.innerHTML = `<div class="match-term">${escapeHtml(k)}</div><div class="match-slot" data-key="${escapeHtml(k)}" role="button" tabindex="0" aria-label="Choose an answer for ${escapeHtml(k)}"></div>`;
        grid.appendChild(row);
        const slot = row.querySelector(".match-slot");
        allowDrop(slot);
        slot.addEventListener("click", event => {
          if (!event.target.closest(".drag-token")) placeSelectedToken(slot);
        });
        slot.addEventListener("keydown", event => {
          if (["Enter", " ", "Space", "Spacebar"].includes(event.key)) {
            event.preventDefault();
            placeSelectedToken(slot);
          }
        });
      });
      document.getElementById("clearInteractiveBtn").addEventListener("click", () => {
        [...grid.querySelectorAll(".match-slot .drag-token")].forEach(t => bank.appendChild(t));
        clearDragSelection();
        announceInteraction("All matches have been cleared.");
      });
      document.getElementById("checkInteractiveBtn").addEventListener("click", () => {
        const answer = {};
        let complete = true;
        [...grid.querySelectorAll(".match-slot")].forEach(slot => {
          if (!slot.firstElementChild) complete = false;
          answer[slot.dataset.key] = slot.firstElementChild ? slot.firstElementChild.dataset.value : "";
        });
        if (!complete) {
          els.feedbackPanel.className = "feedback-panel hint";
          els.feedbackPanel.innerHTML = `<strong>Nearly there</strong><p>Fill every matching box before checking.</p>`;
          els.feedbackPanel.classList.remove("hidden");
          return;
        }
        submitAnswer(answer);
      });
    }

    function disableInteractive() {
      clearDragSelection();
      els.choicesWrap.classList.add("disabled-interaction");
      [...els.choicesWrap.querySelectorAll(".drag-token")].forEach(t => { t.draggable = false; t.tabIndex = -1; });
      [...els.choicesWrap.querySelectorAll("button")].forEach(b => b.disabled = true);
    }

    function loadQuestion() {
      state.answered = false;
      els.feedbackPanel.className = "feedback-panel hidden";
      els.feedbackPanel.innerHTML = "";
      els.nextBtn.classList.add("hidden");
      els.hintBtn.disabled = false;
      els.answerForm.reset();
      els.answerForm.classList.add("hidden");
      els.answerInput.classList.add("hidden");
      els.answerTextArea.classList.add("hidden");
      els.answerInput.disabled = true;
      els.answerTextArea.disabled = true;
      els.submitBtn.disabled = true;
      els.choicesWrap.className = "choices";
      els.choicesWrap.innerHTML = "";

      let entry = null;
      let q = null;
      let questionKey = "";
      for (let candidateAttempt = 0; candidateAttempt < BANK.length; candidateAttempt++) {
        const candidateEntry = pickEntry();
        if (!candidateEntry) break;
        for (let variantAttempt = 0; variantAttempt < 6; variantAttempt++) {
          const candidateQuestion = generateQuestion(candidateEntry, variantAttempt);
          const candidateKey = questionFingerprint(candidateQuestion);
          const repeatedThisRound = state.questionKeys.has(candidateKey);
          const repeatedLastRound = state.previousQuestionKeys.has(candidateKey);
          if (repeatedThisRound || (repeatedLastRound && candidateAttempt < 24)) continue;
          entry = candidateEntry;
          q = candidateQuestion;
          questionKey = candidateKey;
          break;
        }
        state.used.add(candidateEntry.id);
        if (q) break;
      }
      if (!entry || !q) {
        throw new Error("The question bank could not produce another unique question for this round.");
      }
      state.currentEntry = entry;
      state.questionKeys.add(questionKey);
      state.topicCounts[q.topic] = (state.topicCounts[q.topic] || 0) + 1;
      state.currentQuestion = q;

      const topicName = TOPICS[q.topic].name;
      els.tagRow.innerHTML = `<span class="tag">${escapeHtml(topicName)}</span><span class="tag">${escapeHtml(studentActivityTitle(q.title))}</span><span class="tag">Level ${q.difficulty}</span>`;
      els.questionText.textContent = formatSentences(q.prompt);
      if (q.passage) {
        els.passageBox.classList.remove("hidden");
        els.passageBox.innerHTML = `<div class="passage-title">Text</div>${formatTextHtml(q.passage)}`;
      } else {
        els.passageBox.classList.add("hidden");
        els.passageBox.innerHTML = "";
      }
      if (q.support) {
        els.supportBox.classList.remove("hidden");
        els.supportBox.innerHTML = q.support;
      } else {
        els.supportBox.classList.add("hidden");
        els.supportBox.innerHTML = "";
      }

      if (q.kind === "order") {
        renderOrderQuestion(q);
      } else if (q.kind === "match") {
        renderMatchQuestion(q);
      } else {
        if (!q.choices) q.choices = makeChoices(q.answer, smartDistractors(q), v => q.answerType === "money" ? money(Number(v)) : String(v));
        renderChoiceButtons(q);
      }
      updateTopBar();
      requestAnimationFrame(() => {
        els.questionText.focus({ preventScroll: true });
        els.questionText.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      });
    }

    function updateTopBar() {
      els.scoreText.textContent = `Score ${state.score}`;
      els.questionCountText.textContent = `Question ${Math.min(state.index + 1, state.length)} of ${state.length}`;
      const level = state.currentQuestion ? state.currentQuestion.difficulty : topicLevel(state.topic);
      els.levelText.textContent = `Level ${level}`;
      const completed = Math.min(state.index + (state.answered ? 1 : 0), state.length);
      els.progressFill.style.width = `${(completed / state.length) * 100}%`;
      els.progressMeter.setAttribute("aria-valuemax", String(state.length));
      els.progressMeter.setAttribute("aria-valuenow", String(completed));
    }

    function submitAnswer(value, button = null) {
      if (state.answered) return;
      const q = state.currentQuestion;
      let correct = isCorrect(value, q);
      let extraHtml = "";
      state.answered = true;
      if (correct) state.score += 1;
      updateProgress(q.topic, correct);

      if (q.kind === "mc" || q.kind === "cloze" || q.kind === "proofread") {
        [...els.choicesWrap.children].forEach(btn => {
          btn.disabled = true;
          const btnChoice = q.choices[Number(btn.dataset.choiceIndex)];
          if (btnChoice && isCorrect(btnChoice.value, q)) {
            btn.classList.add("correct");
            btn.textContent = `${formatSentences(btnChoice.label)}\n\n✓ Correct answer`;
            btn.setAttribute("aria-label", `${btnChoice.label}. Correct answer.`);
          }
        });
        if (button && !correct) {
          const selectedChoice = q.choices[Number(button.dataset.choiceIndex)];
          button.classList.add("wrong");
          button.textContent = `${formatSentences(selectedChoice ? selectedChoice.label : value)}\n\n✗ Your answer`;
          button.setAttribute("aria-label", `${selectedChoice ? selectedChoice.label : value}. Your answer was not correct.`);
        }
      } else if (q.kind === "order" || q.kind === "match") {
        disableInteractive();
      }

      const expected = answerLabel(q);
      const entered = displayValue(value);
      state.history.push({
        topic: TOPICS[q.topic].name,
        title: studentActivityTitle(q.title),
        prompt: q.prompt,
        correct,
        answer: expected,
        entered,
        explanation: q.explanation
      });

      els.feedbackPanel.className = `feedback-panel ${correct ? "good" : "bad"}`;
      els.feedbackPanel.innerHTML = correct
        ? `<strong>Correct.</strong><p>${formatTextHtml(q.explanation || "Good work.")}</p>${extraHtml}`
        : `<strong>Not quite.</strong><p>Correct answer: <span class="kbd">${formatTextHtml(expected)}</span></p><p>${formatTextHtml(q.explanation || "Review the clue and try a similar question next.")}</p>${extraHtml}`;
      els.feedbackPanel.classList.remove("hidden");
      els.nextBtn.classList.remove("hidden");
      els.hintBtn.disabled = true;
      updateTopBar();
    }

    function updateProgress(topic, correct) {
      const p = progress.topics[topic];
      p.total += 1;
      progress.lifetime.total += 1;
      if (correct) {
        p.correct += 1;
        progress.lifetime.correct += 1;
        p.streak += 1;
        p.misses = 0;
        p.bestStreak = Math.max(p.bestStreak || 0, p.streak);
        if (p.streak >= 3 && p.level < 5) {
          p.level += 1;
          p.streak = 0;
        }
      } else {
        p.streak = 0;
        p.misses = (p.misses || 0) + 1;
        if (p.misses >= 2 && p.level > 1) {
          p.level -= 1;
          p.misses = 0;
        }
      }
      saveProgress();
    }

    function nextQuestion() {
      state.index += 1;
      if (state.index >= state.length) showResults();
      else loadQuestion();
    }

    function showHint() {
      const q = state.currentQuestion;
      els.feedbackPanel.className = "feedback-panel hint";
      els.feedbackPanel.innerHTML = `<strong>Hint</strong><p>${formatTextHtml(q.hint)}</p>`;
      els.feedbackPanel.classList.remove("hidden");
    }

    function showResults() {
      els.quizScreen.classList.add("hidden");
      els.resultsScreen.classList.remove("hidden");
      els.progressFill.style.width = "100%";
      const pct = Math.round((state.score / state.length) * 100);
      els.finalScore.textContent = `${state.score}/${state.length}`;
      els.finalMessage.textContent = pct >= 85 ? "Excellent accuracy. Try a longer mixed round next." : pct >= 65 ? "Good progress. Review the skills marked ‘Developing’ and keep practising." : "Keep going. Review the skills marked ‘Practise next’ and read the feedback carefully.";

      const byTopic = {};
      state.history.forEach(h => {
        byTopic[h.topic] = byTopic[h.topic] || { total: 0, correct: 0 };
        byTopic[h.topic].total += 1;
        if (h.correct) byTopic[h.topic].correct += 1;
      });
      els.topicReview.innerHTML = Object.keys(byTopic).map(topic => {
        const item = byTopic[topic];
        const p = Math.round(item.correct / item.total * 100);
        const status = p >= 75 ? "Secure" : p >= 50 ? "Developing" : "Practise next";
        return `<div class="review-card"><strong>${escapeHtml(topic)}</strong><br>${item.correct}/${item.total} correct<br><span class="kbd">${status}</span></div>`;
      }).join("");

      els.reviewWrap.setAttribute("tabindex", "0");
      els.reviewWrap.setAttribute("aria-label", "Question review table; scroll sideways if needed");
      els.reviewWrap.innerHTML = `<table><caption class="sr-only">Review of this round</caption><thead><tr><th scope="col">#</th><th scope="col">Topic</th><th scope="col">Result</th><th scope="col">Your answer</th><th scope="col">Correct answer and feedback</th></tr></thead><tbody>${state.history.map((h, i) => `<tr><td>${i+1}</td><td>${escapeHtml(h.topic)}<br><small>${escapeHtml(h.title)}</small></td><td>${h.correct ? "✓ Correct" : "✗ Review"}</td><td>${formatTextHtml(h.entered)}</td><td><strong>${formatTextHtml(h.answer)}</strong><br><small>${formatTextHtml(h.explanation)}</small></td></tr>`).join("")}</tbody></table>`;
      requestAnimationFrame(() => els.resultsHeading.focus());
    }

    function goHome() {
      els.quizScreen.classList.add("hidden");
      els.resultsScreen.classList.add("hidden");
      els.homeToolbar.classList.remove("hidden");
      els.homeScreen.classList.remove("hidden");
      renderHome();
      requestAnimationFrame(() => els.homeHeading.focus());
    }

    els.answerForm.addEventListener("submit", e => {
      e.preventDefault();
      return false;
    });
    els.hintBtn.addEventListener("click", showHint);
    els.nextBtn.addEventListener("click", nextQuestion);
    els.backBtn.addEventListener("click", goHome);
    els.homeBtn.addEventListener("click", goHome);
    els.playAgainBtn.addEventListener("click", () => startRound(state.topic));
    els.resetProgressBtn.addEventListener("click", () => {
      if (confirm("Reset all English Practice Quest progress?")) {
        progress = defaultProgress();
        saveProgress();
        renderHome();
      }
    });

    buildBank();
    extendBankNoTyped300();
    renderHome();
  </script>
</body>
</html>
